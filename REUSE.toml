# Copyright and licensing information for the files of APR, following the REUSE specification (https://reuse.software/spec/).
# Check it with "reuse lint".
#
# Files written for APR carry the standard ASF license header and no copyright notice of their own;
# the annotation below records them as Apache-2.0, copyright The Apache Software Foundation (see NOTICE).
# Third-party code carries SPDX-License-Identifier and SPDX-FileCopyrightText tags next to its original notice,
# or SPDX-Snippet* tags around the parts of a file it occupies;
# these take precedence.
# Files copied unmodified from other projects are annotated further down instead, so that they stay unmodified.
#
# The texts of all licenses are in LICENSES/.

version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# GNU config, copied from https://git.savannah.gnu.org/git/config.git
[[annotations]]
path = ["build/config.guess", "build/config.sub"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 1992-2025 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later WITH Autoconf-exception-generic-3.0"

# Copied from the GNU Autoconf Archive
[[annotations]]
path = "build/ax_prog_cc_for_build.m4"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2008 Paolo Bonzini <bonzini@gnu.org>"
SPDX-License-Identifier = "FSFAP"

# Files generated by buildconf, which are not in version control but are in release tarballs.
# The libtool files are copied by libtoolize; their copyright years depend on the libtool version used.
[[annotations]]
path = "build/ltmain.sh"
precedence = "override"
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-2.0-or-later WITH Libtool-exception"

[[annotations]]
path = "build/libtool.m4"
precedence = "override"
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "FSFULLR AND GPL-2.0-or-later WITH Libtool-exception"

[[annotations]]
path = ["build/ltoptions.m4", "build/ltsugar.m4", "build/ltversion.m4", "build/lt~obsolete.m4"]
precedence = "override"
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "FSFULLR"

# Generated by autoconf from configure.in: Autoconf's shell code with APR's own configuration logic.
[[annotations]]
path = "configure"
precedence = "override"
SPDX-FileCopyrightText = ["Free Software Foundation, Inc.", "The Apache Software Foundation"]
SPDX-License-Identifier = "Apache-2.0 AND FSFUL"
